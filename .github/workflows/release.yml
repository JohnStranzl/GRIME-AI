name: Official Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    name: Release Conda Build
    runs-on: ubuntu-latest
    container: quay.io/condaforge/linux-anvil-cos7-x86_64
    steps:
      - name: Checkout repo
        run: |
          cd $GITHUB_WORKSPACE
          source /opt/conda/etc/profile.d/conda.sh
          conda activate base
          git clone -b $GITHUB_REF_NAME $GITHUB_SERVER_URL/$GITHUB_REPOSITORY .

      - name: Verify tag matches SW_VERSION
        run: |
          cd $GITHUB_WORKSPACE
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -Po '(?<=^SW_VERSION = ")[^"]+' src/GRIME_AI/version.py)
          [ "$TAG" = "$VER" ] || { echo "Tag $TAG != SW_VERSION $VER"; exit 1; }

      - name: Stamp release channel
        run: |
          cd $GITHUB_WORKSPACE
          sed -i 's/^RELEASE = .*/RELEASE = "stable"/' src/GRIME_AI/version.py

      - name: Build and upload to main label
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          source /opt/conda/etc/profile.d/conda.sh
          conda activate base
          conda install conda-forge-pinning=2024.11.29.12.37.53 -y
          conda config --set anaconda_upload yes
          conda build -c grimelab -e /opt/conda/conda_build_config.yaml \
          --label main --user grimelab --token $ANACONDA_API_TOKEN recipe/grime-ai
          conda clean -a -y

  release-container:
    name: Release Container Build
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Stamp release channel
        run: sed -i 's/^RELEASE = .*/RELEASE = "stable"/' src/GRIME_AI/version.py

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read version.py metadata
        id: version
        run: |
          python - <<'EOF'
          import re, os
          with open("src/GRIME_AI/version.py") as f:
              content = f.read()
          def get_var(name):
              match = re.search(rf'^{name}\s*=\s*["\'](.+?)["\']', content, re.MULTILINE)
              return match.group(1) if match else ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={get_var('SW_VERSION')}\n")
              out.write(f"commit={get_var('SHA')[:7]}\n")
              out.write(f"release={get_var('RELEASE')}\n")
              out.write(f"date={get_var('BUILD_DATE')}\n")
              out.write(f"package_name=grimelab::grime-ai={get_var('SW_VERSION')}\n")
          EOF

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.commit }}
            type=raw,value=stable

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./recipe/docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GRIME_PACKAGE=${{ steps.version.outputs.package_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
